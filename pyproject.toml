[project]
name = "still200-sdk"
version = "0.1.1"
description = "Still200 Monitoring SDK"
readme = "README.md"
authors = [
    { name = "Dennis Wainaina", email = "dennis@byteslab.io" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
